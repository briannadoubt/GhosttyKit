version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "02:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
      time: "02:30"
      timezone: America/Los_Angeles
    commit-message:
      prefix: build
    labels:
      - dependencies
      - libghostty
