name: Refresh libghostty

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .gitmodules
      - Vendor/ghostty-upstream
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'dependabot[bot]'
    runs-on: macos-15

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.ref || github.ref_name }}
          submodules: recursive

      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Check out workflow helper scripts
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.base_ref || github.ref_name }}
          path: .ghosttykit-tools
          sparse-checkout: Scripts/install-zig-from-ghostty.sh
          sparse-checkout-cone-mode: false
          submodules: false

      - name: Install Zig required by upstream Ghostty
        run: bash .ghosttykit-tools/Scripts/install-zig-from-ghostty.sh

      - name: Regenerate vendored libghostty
        run: ./Scripts/update-libghostty.sh

      - name: Test CI helper scripts
        run: |
          bash Tests/Scripts/find-ghosttykit-static-library-test.sh
          bash Tests/Scripts/install-zig-from-ghostty-test.sh
          bash Tests/Scripts/update-libghostty-test.sh

      - name: Verify package is publishable
        run: |
          if swift package dump-package | grep -q '"unsafeFlags"'; then
            echo "Package.swift still uses unsafe build flags." >&2
            exit 1
          fi

      - name: Verify vendored libghostty metadata
        run: ./Scripts/check-libghostty-sync.sh

      - name: Build package
        run: swift build

      - name: Run tests
        run: swift test

      - name: Commit regenerated artifacts
        run: |
          git add Sources/GhosttyKit/include Vendor/GhosttyKit.xcframework.zip Vendor/GhosttyKit.checksum Vendor/libghostty.version

          if git diff --cached --quiet; then
            echo "No regenerated artifact changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh vendored libghostty"
          git push
